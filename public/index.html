<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E3578" />
    <meta name="description" content="MESOB Sululta Branch — One-Stop Government Service Center. Access 180+ government services in one location." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>One Stop Service Center (MESOB) Sululta</title>
    <!-- Prevent dark mode flash: apply theme before React mounts -->
    <script>
      (function() {
        var t = localStorage.getItem('mesob_theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
